# Production overrides — use pre-built GHCR images instead of local builds.
#
# Usage (with self-hosted):
#   docker compose -f docker-compose.yml \
#     -f docker-compose.selfhosted.yml \
#     -f docker-compose.production.yml up -d
#
# Set GHCR_OWNER to your GitHub username/org (default: alcybersec).
# Set IMAGE_TAG to pin a version (default: latest).

services:
  ui:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-ui:${IMAGE_TAG:-latest}
    build: !reset null

  api:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-api:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      # SEC-06: passed through from the environment / .env, deliberately no
      # default -- the api and worker refuse to start without it unless
      # SINGLE_USER_MODE=true. See docs/deployment.md.
      SETTINGS_ENCRYPTION_KEY:

  worker:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-api:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      # SEC-06: passed through from the environment / .env, deliberately no
      # default -- the api and worker refuse to start without it unless
      # SINGLE_USER_MODE=true. See docs/deployment.md.
      SETTINGS_ENCRYPTION_KEY:
      # GL#12 / R-030: uid/gid of `claudecli` in the image (worker only).
      CLAUDE_CLI_UID: "10001"
      CLAUDE_CLI_GID: "10001"

  # TECH-09: the queue-split pools (see docker-compose.yml) run the same image.
  worker-ondemand:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-api:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      SETTINGS_ENCRYPTION_KEY:
      CLAUDE_CLI_UID: "10001"
      CLAUDE_CLI_GID: "10001"

  worker-maintenance:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-api:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      SETTINGS_ENCRYPTION_KEY:

  beat:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-api:${IMAGE_TAG:-latest}
    build: !reset null
