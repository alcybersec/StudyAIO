<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudyAIO — AI-powered study workspace. Transform lectures into flashcards, summaries, quizzes, and exam prep materials." />
    <meta property="og:title" content="StudyAIO" />
    <meta property="og:description" content="AI-powered study workspace — flashcards, summaries, and exam prep from your lecture files." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StudyAIO" />
    <title>StudyAIO</title>
    <script>
      // Prevent flash of wrong theme on page load
      (function() {
        var theme = localStorage.getItem('studyaio-theme');
        if (theme === 'dark' || ((!theme || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
