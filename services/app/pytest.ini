[pytest]
asyncio_mode = auto
testpaths = tests

# DATA_DIR is *not* set here. pytest's ini has no way to put a variable into the
# environment (that needs the pytest-env plugin, which cannot mint a unique temp
# directory per run anyway — a fixed path would be shared by concurrent runs).
#
# The storage root is pinned in `conftest.py` beside this file instead: pytest
# loads the rootdir conftest as an *initial* conftest, during config creation,
# which is the earliest in-process point that still precedes the first
# `import app.config`. That matters because `settings` reads the environment once
# at import time and `importlib.reload` does not propagate a new value (#56).
#
# Read that conftest before changing anything here: it is what stops the suite
# from resolving `settings.data_dir` to the real `/app/data` (#100).
