# GitLab CI for StudyAIO. Ported from .github/workflows/ci.yml (2026-09-26).
#
# The GitHub CI jobs all ran on GitHub-HOSTED ubuntu-latest with `container:` +
# `services:`, which maps almost 1:1 onto GitLab. Four deliberate differences:
#
#  1. GitLab has no `--health-cmd`. `services:` start in PARALLEL with the job,
#     so readiness is the job's own responsibility (before_script below).
#  2. Service containers are reached by ALIAS, not localhost. GitLab derives an
#     alias from the image name, so `redis:7-alpine` is already `redis` -- but
#     `pgvector/pgvector:pg16` derives to `pgvector`, NOT `postgres`, so that one
#     needs an explicit alias. (Setting an alias that matches the derived one is
#     skipped with "alias is already in use by another service".)
#  3. `e2e-tests` changes execution model. On GitHub it ran on the runner HOST,
#     so Playwright, uvicorn and the published service ports all met on
#     localhost. Here it runs INSIDE a container: postgres/redis move to
#     aliases, while the API and the previewed UI really are on localhost
#     because the job starts them itself.
#  4. Runners are registered run_untagged:false -- every job MUST carry tags.
#
# Images keep going to GHCR, deliberately. docker-compose.prod.yml references
# ghcr.io/${GHCR_OWNER}/studyaio-{api,ui} in several places and the deploy host
# logs in to GHCR to pull, so repointing at the GitLab registry would mean
# changing production compose, the host's docker login and the .env pinning.
# Keeping GHCR makes this migration purely a change of WHO RUNS THE BUILD.

stages:
  - lint
  - test
  - e2e
  - build
  - deploy

default:
  tags: [homelab, docker]
  interruptible: true

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # The torch CPU wheel alone is ~200MB; the CPU index keeps CI off the CUDA build.
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  npm_config_cache: $CI_PROJECT_DIR/.cache/npm

# Redis has no client binary in these images, so reachability is checked in pure
# Python. The official image binds its port only once ready to serve.
.wait-for-redis: &wait-for-redis
  - |
    python3 - <<'PY'
    import socket, sys, time
    for _ in range(60):
        try:
            socket.create_connection(("redis", 6379), timeout=2).close()
            print("redis:6379 ready"); break
        except OSError:
            time.sleep(1)
    else:
        sys.exit("FATAL: redis:6379 never became reachable")
    PY

.pip-cache: &pip-cache
  key:
    files: [services/app/requirements.txt]
    prefix: pip
  paths: [.cache/pip]

python-lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install "ruff>=0.8,<1.0"
    - cd services/app
    - ruff check .
    - ruff format --check .

backend-tests:
  stage: test
  image: python:3.12-slim
  needs: [python-lint]
  cache: *pip-cache
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential libpq-dev
    - cd services/app
    - pip install -r requirements.txt
  script:
    - python -m pytest tests/unit -x -v -n auto --cov=app --cov-report=term-missing
      --cov-report=xml:coverage.xml --cov-fail-under=75
    - python -m pytest tests/golden -x -v
  artifacts:
    when: always
    paths: [services/app/coverage.xml]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: services/app/coverage.xml

integration-tests:
  stage: test
  image: python:3.12-slim
  needs: [python-lint]
  services:
    # Explicit alias REQUIRED: the derived alias would be `pgvector`.
    - name: pgvector/pgvector:pg16
      alias: postgres
    - redis:7-alpine
  cache: *pip-cache
  variables:
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    POSTGRES_DB: testdb
    DATABASE_URL: postgresql+asyncpg://testuser:testpass@postgres:5432/testdb
    DATABASE_URL_SYNC: postgresql://testuser:testpass@postgres:5432/testdb
    REDIS_URL: redis://redis:6379/0
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential libpq-dev postgresql-client
    # pg_isready means "accepting queries", which TCP reachability does not.
    - for i in $(seq 1 60); do pg_isready -h postgres -U testuser -d testdb && break; sleep 1; done
    - *wait-for-redis
    - PGPASSWORD=testpass psql -h postgres -U testuser -d testdb -c "CREATE EXTENSION IF NOT EXISTS vector;"
    - cd services/app
    - pip install -r requirements.txt
  script:
    - python -m pytest tests/integration -x -v

frontend-checks:
  stage: test
  image: node:20-slim
  cache:
    key:
      files: [services/ui/package-lock.json]
      prefix: npm
    paths: [.cache/npm]
  before_script:
    - cd services/ui
    - npm ci
  script:
    - npx tsc --noEmit
    # `npm run lint` already runs check-colors.sh; the explicit call is kept so
    # the guard still runs if the lint script is ever changed.
    - npm run lint
    - bash scripts/check-colors.sh
    # package.json's "test" is already `vitest run`, so it exits rather than watching.
    - npm test
    - npm run build
    - bash scripts/check-bundle.sh
  # Hand the built bundle to e2e so it isn't rebuilt from scratch.
  artifacts:
    expire_in: 1 day
    paths: [services/ui/dist]

e2e-tests:
  stage: e2e
  # Tag MUST track @playwright/test in services/ui/package-lock.json (^1.58.2).
  # A mismatch makes `playwright install` re-download the browser and defeats the
  # point of using this image. Python is added below rather than adding a browser
  # and its system libraries to python:3.12-slim.
  #
  # -noble, NOT -jammy. The GitHub job installed Python 3.12 explicitly via
  # actions/setup-python, and services/app/Dockerfile is built FROM
  # python:3.12-slim -- so e2e must run on 3.12 or it exercises a different
  # interpreter than production. jammy (Ubuntu 22.04) ships python3 = 3.10;
  # noble (24.04) ships 3.12. jammy also ships pip 22.x, which predates
  # --break-system-packages and fails with `no such option` (seen in pipeline
  # 293); noble enforces PEP 668, so that flag is required there.
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  needs: [frontend-checks]
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
    - redis:7-alpine
  variables:
    POSTGRES_USER: studyaio
    POSTGRES_PASSWORD: studyaio
    POSTGRES_DB: studyaio
    # Aliases, not localhost: this job now runs inside a container.
    DATABASE_URL: postgresql+asyncpg://studyaio:studyaio@postgres:5432/studyaio
    DATABASE_URL_SYNC: postgresql://studyaio:studyaio@postgres:5432/studyaio
    REDIS_URL: redis://redis:6379/0
    SELF_HOSTED: "true"
    JWT_SECRET_KEY: e2e-ephemeral-secret-not-used-outside-ci
    DATA_DIR: $CI_PROJECT_DIR/e2e-data
    LOG_FORMAT: json
    # The API and the previewed UI run inside THIS container, so these really
    # are localhost.
    E2E_BASE_URL: http://localhost:3001
    E2E_API_URL: http://localhost:8000
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 python3-pip python3-venv libpq-dev postgresql-client
    - for i in $(seq 1 60); do pg_isready -h postgres -U studyaio -d studyaio && break; sleep 1; done
    - *wait-for-redis
    - PGPASSWORD=studyaio psql -h postgres -U studyaio -d studyaio -c "CREATE EXTENSION IF NOT EXISTS vector;"
    - python3 -m pip install --break-system-packages -r services/app/requirements.txt
  script:
    - mkdir -p "$DATA_DIR"
    - cd services/app
    - alembic upgrade head
    # No Celery worker: the suite asserts uploads are accepted and queued, never
    # that the pipeline finishes, so the broker alone is enough.
    - nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$CI_PROJECT_DIR/api.log" 2>&1 &
    - |
      for i in $(seq 1 60); do
        curl -fsS http://localhost:8000/health/ready > /dev/null && { echo "API ready after ${i}s"; break; }
        if [ "$i" = "60" ]; then echo "API failed to become ready"; cat "$CI_PROJECT_DIR/api.log"; exit 1; fi
        sleep 1
      done
    - cd ../ui
    - npm ci
    - nohup npx vite preview --port 3001 > "$CI_PROJECT_DIR/ui.log" 2>&1 &
    - |
      for i in $(seq 1 30); do
        curl -fsS http://localhost:3001/ > /dev/null && { echo "UI ready after ${i}s"; break; }
        if [ "$i" = "30" ]; then echo "UI failed to become ready"; cat "$CI_PROJECT_DIR/ui.log"; exit 1; fi
        sleep 1
      done
    - npx playwright test
  # Paths are relative to CI_PROJECT_DIR, not the job's cwd. api.log/ui.log are
  # written with an explicit $CI_PROJECT_DIR prefix for exactly this reason.
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - services/ui/playwright-report/
      - api.log
      - ui.log

# ---------------------------------------------------------------------------
# Image build + deploy. Ported from .github/workflows/deploy.yml (2026-09-27).
#
# Both build jobs need real host Docker, so they are the only ones on the shell
# runner -- the docker runner is privileged:false with no socket.
# ---------------------------------------------------------------------------
.ghcr-build:
  stage: build
  tags: [shell]
  interruptible: false          # an interrupted push can leave a partial tag
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    # MANDATORY on LXC 207: Docker 29.x uses the containerd image store, so
    # `docker build` runs via BuildKit and attaches a provenance attestation by
    # default. The resulting OCI index references the empty-JSON blob
    # sha256:44136fa355b3..., and a GitLab/GHCR manifest PUT then fails with
    # `blob unknown to registry` / MANIFEST_BLOB_UNKNOWN -- AFTER every layer has
    # pushed successfully, so it reads as a registry fault. Cost a pipeline on
    # the_arbitrage_project (288) to diagnose.
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    # 7 characters, NOT CI_COMMIT_SHORT_SHA (which is 8). The deploy script
    # computes IMAGE_TAG with `cut -c1-7` and pulls that exact tag, so an 8-char
    # push would 404 at deploy time with CI already green.
    IMAGE_TAG: ${CI_COMMIT_SHA:0:7}
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_OWNER" --password-stdin
  script:
    - docker build --provenance=false --sbom=false
      $EXTRA_BUILD_ARGS
      -t "ghcr.io/$GHCR_OWNER/$IMAGE_NAME:$IMAGE_TAG"
      -t "ghcr.io/$GHCR_OWNER/$IMAGE_NAME:latest"
      "$BUILD_CONTEXT"
    - docker push "ghcr.io/$GHCR_OWNER/$IMAGE_NAME:$IMAGE_TAG"
    - docker push "ghcr.io/$GHCR_OWNER/$IMAGE_NAME:latest"
  after_script:
    # This host shares one Docker daemon and has already hit 100% disk once.
    - docker image rm "ghcr.io/$GHCR_OWNER/$IMAGE_NAME:$IMAGE_TAG" || true

build-api:
  extends: .ghcr-build
  needs: [backend-tests, integration-tests]
  variables:
    IMAGE_NAME: studyaio-api
    BUILD_CONTEXT: services/app

build-ui:
  extends: .ghcr-build
  needs: [frontend-checks]
  variables:
    IMAGE_NAME: studyaio-ui
    BUILD_CONTEXT: services/ui
    # Vite inlines VITE_* at BUILD time, so frontend Sentry must be configured
    # here, not at runtime. Unset secret -> empty -> monitoring stays off.
    EXTRA_BUILD_ARGS: >-
      --build-arg VITE_SENTRY_DSN=$VITE_SENTRY_DSN
      --build-arg VITE_SENTRY_ENVIRONMENT=production
      --build-arg VITE_SENTRY_RELEASE=$CI_COMMIT_SHA

deploy-selfhosted:
  stage: deploy
  image: alpine:latest
  needs: [build-api, build-ui, e2e-tests]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/
  resource_group: studyaio-prod   # serialize deploys; never cancel one midway
  variables:
    IMAGE_TAG: ${CI_COMMIT_SHA:0:7}
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$DEPLOY_SSH_KEY"
  script:
    # Ref guard, kept as a SHELL assertion on purpose. The GitHub job deliberately
    # avoided a job-level `if:` because a condition that does not match makes the
    # job SKIP, and a skipped job reports as a green run -- an unintended ref would
    # look like a successful deploy. GitLab `rules:` have exactly the same
    # property, so the assertion stays.
    - |
      if [ "$CI_COMMIT_BRANCH" != "main" ] && ! echo "${CI_COMMIT_TAG:-}" | grep -qE '^v'; then
        echo "Deploy ref guard: refusing to deploy from branch='${CI_COMMIT_BRANCH:-}' tag='${CI_COMMIT_TAG:-}'"
        echo "Expected: branch main, or a v* tag. Nothing was copied and no containers were touched."
        exit 1
      fi
      echo "Ref guard passed: branch='${CI_COMMIT_BRANCH:-}' tag='${CI_COMMIT_TAG:-}'"
    - |
      scp -i "$DEPLOY_SSH_KEY" -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
        -P "${DEPLOY_SSH_PORT:-22}" \
        docker-compose.yml docker-compose.prod.yml \
        "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"
      scp -i "$DEPLOY_SSH_KEY" -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
        -P "${DEPLOY_SSH_PORT:-22}" \
        scripts/preflight-check.sh scripts/backup.sh scripts/restore.sh \
        "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/scripts/"
    - |
      # DEPLOY_DIR is passed explicitly rather than relying on the remote default:
      # the `${DEPLOY_DIR:-/opt/studyaio}` fallback below would silently deploy to
      # the right place today and the wrong place the day the directory moves.
      #
      # NOTE: GHCR_TOKEN is passed as a remote env assignment, so it is briefly
      # visible in `ps` on the deploy host. Acceptable on a single-admin box, and
      # no worse than the GitHub job which interpolated the secret into the script
      # text -- but it is the reason this must never run against a shared host.
      ssh -i "$DEPLOY_SSH_KEY" -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
        -p "${DEPLOY_SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
        GHCR_OWNER="$GHCR_OWNER" IMAGE_TAG="$IMAGE_TAG" GHCR_TOKEN="$GHCR_TOKEN" \
        DEPLOY_DIR="$DEPLOY_DIR" 'bash -s' <<'REMOTE'
      set -euo pipefail
      cd "${DEPLOY_DIR:-/opt/studyaio}"
      API_IMAGE="ghcr.io/${GHCR_OWNER}/studyaio-api:${IMAGE_TAG}"
      UI_IMAGE="ghcr.io/${GHCR_OWNER}/studyaio-ui:${IMAGE_TAG}"
      COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

      echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_OWNER}" --password-stdin

      docker pull "${API_IMAGE}"
      docker pull "${UI_IMAGE}"
      docker tag "${API_IMAGE}" "ghcr.io/${GHCR_OWNER}/studyaio-api:latest"
      docker tag "${UI_IMAGE}" "ghcr.io/${GHCR_OWNER}/studyaio-ui:latest"

      # Pin the deployed build so a later manual `up` reproduces this exact SHA
      # instead of drifting to a stale image or a local build.
      touch .env
      sed -i '/^GHCR_OWNER=/d;/^IMAGE_TAG=/d' .env
      printf 'GHCR_OWNER=%s\nIMAGE_TAG=%s\n' "${GHCR_OWNER}" "${IMAGE_TAG}" >> .env

      $COMPOSE up -d --no-build --remove-orphans
      $COMPOSE exec -T api alembic upgrade head

      sleep 5
      $COMPOSE exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      curl -fsS -o /dev/null "http://localhost:${UI_PORT:-3001}/"
      echo "Deployment successful"
      REMOTE
  environment:
    name: production
