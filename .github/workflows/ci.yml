name: CI

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  python-lint:
    name: Python Lint
    runs-on: [self-hosted, homelab]
    container:
      image: python:3.12-slim
    steps:
      - name: Fix workspace permissions
        run: chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE || true

      - uses: actions/checkout@v4

      - name: Install ruff
        run: pip install "ruff>=0.8,<1.0"

      - name: Lint check
        working-directory: services/app
        run: ruff check .

      - name: Format check
        working-directory: services/app
        run: ruff format --check .

  backend-tests:
    name: Backend Tests
    needs: python-lint
    runs-on: [self-hosted, homelab]
    container:
      image: python:3.12-slim
    steps:
      - name: Fix workspace permissions
        run: chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE || true

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential libpq-dev \
          && rm -rf /var/lib/apt/lists/*

      - name: Install dependencies (CPU-only PyTorch)
        working-directory: services/app
        run: pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Run unit tests with coverage
        working-directory: services/app
        run: python -m pytest tests/unit -x -v -n auto --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=75

      - name: Run golden tests
        working-directory: services/app
        run: python -m pytest tests/golden -x -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: services/app/coverage.xml

  integration-tests:
    name: Integration Tests
    needs: python-lint
    runs-on: [self-hosted, homelab]
    container:
      image: python:3.12-slim
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://testuser:testpass@postgres:5432/testdb
      DATABASE_URL_SYNC: postgresql://testuser:testpass@postgres:5432/testdb
      REDIS_URL: redis://redis:6379/0
    steps:
      - name: Fix workspace permissions
        run: chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE || true

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential libpq-dev postgresql-client \
          && rm -rf /var/lib/apt/lists/*

      - name: Install dependencies (CPU-only PyTorch)
        working-directory: services/app
        run: pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Enable pgvector extension
        run: PGPASSWORD=testpass psql -h postgres -U testuser -d testdb -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run integration tests
        working-directory: services/app
        run: python -m pytest tests/integration -x -v

  frontend-checks:
    name: Frontend Checks
    runs-on: [self-hosted, homelab]
    container:
      image: node:20-slim
    steps:
      - name: Fix workspace permissions
        run: chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE || true

      - uses: actions/checkout@v4

      - name: Npm cache
        uses: actions/cache@v4
        with:
          path: /root/.npm
          key: npm-${{ hashFiles('services/ui/package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        working-directory: services/ui
        run: npm ci

      - name: TypeScript check
        working-directory: services/ui
        run: npx tsc --noEmit

      - name: Lint
        working-directory: services/ui
        run: npm run lint

      - name: Color token guard
        working-directory: services/ui
        run: bash scripts/check-colors.sh

      - name: Unit tests
        working-directory: services/ui
        run: npm run test

      - name: Production build
        working-directory: services/ui
        run: npm run build

      - name: Bundle size budget
        working-directory: services/ui
        run: bash scripts/check-bundle.sh
