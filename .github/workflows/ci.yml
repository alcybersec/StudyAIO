name: CI

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.8,<1.0"

      - name: Lint check
        working-directory: services/app
        run: ruff check .

      - name: Format check
        working-directory: services/app
        run: ruff format --check .

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/app/requirements.txt

      - name: Install dependencies
        working-directory: services/app
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        working-directory: services/app
        run: python -m pytest tests/unit -x -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=75

      - name: Run golden tests
        working-directory: services/app
        run: python -m pytest tests/golden -x -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: services/app/coverage.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/testdb
      DATABASE_URL_SYNC: postgresql://testuser:testpass@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/app/requirements.txt

      - name: Install dependencies
        working-directory: services/app
        run: pip install -r requirements.txt

      - name: Enable pgvector extension
        run: PGPASSWORD=testpass psql -h localhost -U testuser -d testdb -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run integration tests
        working-directory: services/app
        run: python -m pytest tests/integration -x -v

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/ui/package-lock.json

      - name: Install dependencies
        working-directory: services/ui
        run: npm ci

      - name: TypeScript check
        working-directory: services/ui
        run: npx tsc --noEmit

      - name: Lint
        working-directory: services/ui
        run: npm run lint

      - name: Production build
        working-directory: services/ui
        run: npm run build
