# Build container images and push to GHCR.
# Triggered on version tags (v*) and pushes to main.

name: Build & Deploy

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
      - develop
    paths:
      - 'services/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/studyaio-api
  UI_IMAGE: ghcr.io/${{ github.repository_owner }}/studyaio-ui

permissions:
  contents: read
  packages: write

jobs:
  build-api:
    name: Build API Image
    runs-on: [self-hosted, homelab]
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/__w" alpine chown -R $(id -u):$(id -g) /__w || true

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: services/app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-ui:
    name: Build UI Image
    runs-on: [self-hosted, homelab]
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/__w" alpine chown -R $(id -u):$(id -g) /__w || true

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.UI_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: services/ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-selfhosted:
    name: Deploy to Self-Hosted Server
    needs: [build-api, build-ui]
    runs-on: [self-hosted, homelab]
    if: |
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      && vars.DEPLOY_TARGET == 'selfhosted'
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/__w" alpine chown -R $(id -u):$(id -g) /__w || true

      - uses: actions/checkout@v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          source: "docker-compose.yml,docker-compose.selfhosted.yml"
          target: ${{ vars.DEPLOY_DIR || '~/studyaio' }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_DIR || '~/studyaio' }}

            export GHCR_OWNER="${{ github.repository_owner }}"
            export IMAGE_TAG="$(echo '${{ github.sha }}' | cut -c1-7)"
            export API_IMAGE="ghcr.io/${GHCR_OWNER}/studyaio-api:${IMAGE_TAG}"
            export UI_IMAGE="ghcr.io/${GHCR_OWNER}/studyaio-ui:${IMAGE_TAG}"

            # Log in to GHCR to pull private images
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${GHCR_OWNER}" --password-stdin

            # Pull latest images
            docker pull "${API_IMAGE}"
            docker pull "${UI_IMAGE}"

            # Tag as latest so compose uses them
            docker tag "${API_IMAGE}" "ghcr.io/${GHCR_OWNER}/studyaio-api:latest"
            docker tag "${UI_IMAGE}" "ghcr.io/${GHCR_OWNER}/studyaio-ui:latest"

            # Remove Traefik if left over from previous config
            docker rm -f studyaio-traefik-1 2>/dev/null || true

            # Restart services
            docker compose -f docker-compose.yml \
              -f docker-compose.selfhosted.yml \
              up -d --no-build --remove-orphans

            # Run any pending migrations
            docker compose -f docker-compose.yml \
              -f docker-compose.selfhosted.yml \
              exec -T api alembic upgrade head

            # Verify health
            sleep 5
            docker compose -f docker-compose.yml \
              -f docker-compose.selfhosted.yml \
              exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
            echo "Deployment successful"

  deploy-ecs:
    name: Deploy to ECS
    needs: [build-api, build-ui]
    runs-on: [self-hosted, homelab]
    if: |
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      && vars.DEPLOY_TARGET == 'ecs'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Update ECS API service
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER || 'studyaio-prod-cluster' }} \
            --service ${{ vars.ECS_API_SERVICE || 'studyaio-prod-api' }} \
            --force-new-deployment

      - name: Update ECS Worker service
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER || 'studyaio-prod-cluster' }} \
            --service ${{ vars.ECS_WORKER_SERVICE || 'studyaio-prod-worker' }} \
            --force-new-deployment

      - name: Wait for API deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER || 'studyaio-prod-cluster' }} \
            --services ${{ vars.ECS_API_SERVICE || 'studyaio-prod-api' }}
