# Build container images and push to GHCR.
# Triggered on version tags (v*) and pushes to main.

name: Build & Deploy

on:
  push:
    tags:
      - 'v*'
    # develop is deliberately absent: only main/tags deploy (see the `if` on
    # deploy-selfhosted), so building images for develop only queued work on the
    # single self-hosted runner that real deploys were waiting behind.
    branches:
      - main
      - master
    paths:
      - 'services/**'
      - 'infra/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Serialize deploys rather than cancelling them — an interrupted deploy would
# leave the server half-updated.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/studyaio-api
  UI_IMAGE: ghcr.io/${{ github.repository_owner }}/studyaio-ui

permissions:
  contents: read
  packages: write

jobs:
  build-api:
    name: Build API Image
    runs-on: [self-hosted, homelab]
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/__w" alpine chown -R $(id -u):$(id -g) /__w || true

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: services/app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-ui:
    name: Build UI Image
    runs-on: [self-hosted, homelab]
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/__w" alpine chown -R $(id -u):$(id -g) /__w || true

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.UI_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: services/ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-selfhosted:
    name: Deploy to Self-Hosted Server
    needs: [build-api, build-ui]
    runs-on: [self-hosted, homelab]
    # Deploy on every push to main (or a version tag). The server runs the
    # production overlay (docker-compose.prod.yml) behind Caddy and pulls the
    # GHCR images CI just built — it never builds locally.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/__w" alpine chown -R $(id -u):$(id -g) /__w || true

      - uses: actions/checkout@v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: ${{ vars.DEPLOY_DIR || '~/studyaio' }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_DIR || '~/studyaio' }}

            export GHCR_OWNER="${{ github.repository_owner }}"
            export IMAGE_TAG="$(echo '${{ github.sha }}' | cut -c1-7)"
            export API_IMAGE="ghcr.io/${GHCR_OWNER}/studyaio-api:${IMAGE_TAG}"
            export UI_IMAGE="ghcr.io/${GHCR_OWNER}/studyaio-ui:${IMAGE_TAG}"

            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

            # Log in to GHCR to pull private images
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${GHCR_OWNER}" --password-stdin

            # Pull the exact images CI built for this commit
            docker pull "${API_IMAGE}"
            docker pull "${UI_IMAGE}"

            # Tag as latest for convenience / manual fallback
            docker tag "${API_IMAGE}" "ghcr.io/${GHCR_OWNER}/studyaio-api:latest"
            docker tag "${UI_IMAGE}" "ghcr.io/${GHCR_OWNER}/studyaio-ui:latest"

            # Pin the deployed build in .env so any later manual `up` reproduces
            # this exact SHA instead of drifting to a stale image or local build.
            touch .env
            sed -i '/^GHCR_OWNER=/d;/^IMAGE_TAG=/d' .env
            printf 'GHCR_OWNER=%s\nIMAGE_TAG=%s\n' "${GHCR_OWNER}" "${IMAGE_TAG}" >> .env

            # Roll the stack to the pinned images (no local build)
            $COMPOSE up -d --no-build --remove-orphans

            # Run any pending migrations
            $COMPOSE exec -T api alembic upgrade head

            # Verify health — API readiness AND the UI is actually served on
            # its published port (what Caddy proxies to).
            sleep 5
            $COMPOSE exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
            curl -fsS -o /dev/null "http://localhost:${UI_PORT:-3001}/"
            echo "Deployment successful"
