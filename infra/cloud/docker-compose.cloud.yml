# Single-VM cloud deployment — uses external RDS, ElastiCache, and S3.
# Use with: docker compose -f docker-compose.cloud.yml up -d
#
# This compose file is for small-scale cloud deployments on a single VM
# (e.g., EC2, DigitalOcean droplet) where you still want managed database
# and cache but don't need ECS Fargate.
#
# Required environment variables (in .env):
#   DATABASE_URL, DATABASE_URL_SYNC, REDIS_URL, STORAGE_BACKEND=s3,
#   S3_BUCKET, S3_REGION, DOMAIN, ACME_EMAIL, JWT_SECRET_KEY

services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  ui:
    image: ${UI_IMAGE:-ghcr.io/alcybersec/studyaio-ui:latest}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.ui.entrypoints=websecure"
      - "traefik.http.routers.ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.ui.loadbalancer.server.port=3000"

  api:
    image: ${API_IMAGE:-ghcr.io/alcybersec/studyaio-api:latest}
    restart: unless-stopped
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`, `/health`, `/metrics`, `/docs`, `/openapi.json`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: ${API_IMAGE:-ghcr.io/alcybersec/studyaio-api:latest}
    restart: unless-stopped
    env_file: .env
    command: celery -A app.worker:celery_app worker --loglevel=info --concurrency=4

  beat:
    image: ${API_IMAGE:-ghcr.io/alcybersec/studyaio-api:latest}
    restart: unless-stopped
    env_file: .env
    command: celery -A app.worker:celery_app beat --loglevel=info

volumes:
  letsencrypt:
