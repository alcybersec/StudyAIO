# Self-hosted production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.selfhosted.yml up -d
#
# Uses pre-built GHCR images, removes dev bind mounts, adds restart policies.
# Set GHCR_OWNER (default: alcybersec) and IMAGE_TAG (default: latest) to
# control which images are used.

services:
  ui:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-ui:${IMAGE_TAG:-latest}
    restart: unless-stopped

  api:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes: !override
      - ./data:/app/data

  worker:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A app.worker:celery_app worker --loglevel=info --concurrency=4
    volumes: !override
      - ./data:/app/data
      - ${CLAUDE_CLI_PATH:-~/.local/bin/claude}:/usr/local/bin/claude:ro
      - ${CLAUDE_CONFIG_DIR:-~/.claude}/.credentials.json:/root/.claude/.credentials.json:ro
      - ${CLAUDE_CONFIG_DIR:-~/.claude}/settings.json:/root/.claude/settings.json:ro

  beat:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-api:${IMAGE_TAG:-latest}
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped
