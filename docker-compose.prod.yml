# Production overrides — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from base (dev) compose:
#   - Services run prebuilt GHCR images (no local build) — CI builds once, the
#     server just pulls. Set IMAGE_TAG to pin a specific build (defaults latest).
#   - No source code bind mounts (images contain all code)
#   - API runs multi-worker uvicorn without --reload
#   - Worker runs with higher concurrency
#   - DB and Redis ports not exposed to host
#   - All services restart automatically
#
# GHCR_OWNER / IMAGE_TAG are read from the environment (or .env). The deploy
# pipeline pins IMAGE_TAG to the built commit SHA.

services:
  ui:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-ui:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped

  api:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 35s
    # --forwarded-allow-ips names the reverse proxy whose X-Forwarded-For may be
    # believed. Uvicorn's default is 127.0.0.1, so a proxy on any other host has
    # its headers discarded and every client arrives as that proxy's address —
    # one rate-limit bucket for the whole internet, and an access log that
    # attributes nothing (issue #39). Set FORWARDED_ALLOW_IPS to the proxy's
    # address; the default here keeps uvicorn's safe behaviour when it is unset.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --timeout-graceful-shutdown 30 --forwarded-allow-ips ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes: !override
      - ./data:/app/data

  worker:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    command: celery -A app.worker:celery_app worker --loglevel=info --concurrency=4
    volumes: !override
      - ./data:/app/data
      # Claude CLI comes from the image — never bind-mount a host binary here
      # (see the note in docker-compose.yml). Credentials only.
      - ${CLAUDE_CONFIG_DIR:-~/.claude}/.credentials.json:/root/.claude/.credentials.json:ro
      - ${CLAUDE_CONFIG_DIR:-~/.claude}/settings.json:/root/.claude/settings.json:ro

  beat:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    volumes: !override
      - ./data:/app/data

  db:
    restart: unless-stopped
    ports: !override []

  redis:
    restart: unless-stopped
    ports: !override []
