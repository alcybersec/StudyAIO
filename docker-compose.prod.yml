# Production overrides — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from base (dev) compose:
#   - Services run prebuilt GHCR images (no local build) — CI builds once, the
#     server just pulls. Set IMAGE_TAG to pin a specific build (defaults latest).
#   - No source code bind mounts (images contain all code)
#   - API runs multi-worker uvicorn without --reload
#   - Worker runs with higher concurrency
#   - DB and Redis ports not exposed to host
#   - All services restart automatically
#
# GHCR_OWNER / IMAGE_TAG are read from the environment (or .env). The deploy
# pipeline pins IMAGE_TAG to the built commit SHA.

x-worker-deploy: &worker-deploy
  image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-api:${IMAGE_TAG:-latest}
  pull_policy: always
  restart: unless-stopped

x-worker-environment: &worker-environment
  # SEC-06: passed through from the environment / .env, deliberately no
  # default -- the api and worker refuse to start without it unless
  # SINGLE_USER_MODE=true. See docs/deployment.md.
  SETTINGS_ENCRYPTION_KEY:
  # Metrics: each worker main process serves /metrics on WORKER_METRICS_PORT,
  # aggregating prefork children through PROMETHEUS_MULTIPROC_DIR (tmpfs, wiped
  # on every container start). Beat deliberately gets neither.
  PROMETHEUS_ENABLED: "true"

x-claude-environment: &claude-environment
  # Preferred login: a long-lived token (`claude setup-token`) stored as
  # <dir>/oauth-token (0600). The adapter reads it from this file and hands
  # it only to the CLI subprocess. .credentials.json stays as the fallback.
  # Not root (SEC-006 / M32 N-3). The pools run as the image's `studyaio`, so
  # parsing untrusted PDF/DOCX/PPTX no longer happens as root. Consequence:
  # without CAP_SETUID/CAP_CHOWN the adapter cannot drop the CLI child to
  # another uid, so CLAUDE_CLI_UID/GID are deliberately NOT set here (unset =
  # the child keeps the worker's uid; the adapter's other containment -- empty
  # private cwd, env allowlist, --tools "" -- still applies). The login files
  # must be owned by uid 999 (docs/deployment.md, "AI pool user").
  # HOME is what the CLI child inherits; the image's own HOME (/app) is not
  # writable, so it points at a per-container tmpfs the CLI may write state to.
  HOME: /tmp/claude-home
  CLAUDE_HOST_OAUTH_TOKEN_FILE: /run/claude-host/oauth-token

services:
  ui:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-ui:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped

  api:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 35s
    environment:
      # SEC-06: passed through from the environment / .env, deliberately no
      # default -- the api and worker refuse to start without it unless
      # SINGLE_USER_MODE=true. See docs/deployment.md.
      SETTINGS_ENCRYPTION_KEY:
      # Exposes /metrics on :8000. the reverse proxy should forward only /api/* and /health/*,
      # so it is not public; scrape it host-locally (docs/deployment.md#metrics).
      PROMETHEUS_ENABLED: "true"
    # --forwarded-allow-ips names the reverse proxy whose X-Forwarded-For may be
    # believed. Uvicorn's default is 127.0.0.1, so a proxy on any other host has
    # its headers discarded and every client arrives as that proxy's address —
    # one rate-limit bucket for the whole internet, and an access log that
    # attributes nothing (issue #39). Set FORWARDED_ALLOW_IPS to the proxy's
    # address; the default here keeps uvicorn's safe behaviour when it is unset.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --timeout-graceful-shutdown 30 --forwarded-allow-ips ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes: !override
      - ./data:/app/data

  worker:
    # Pipeline pool (upload chain). Concurrency unchanged from the single worker.
    <<: *worker-deploy
    command: celery -A app.worker:celery_app worker --loglevel=info -Q pipeline,celery -n pipeline@%h --concurrency=4
    volumes: !override
      - ./data:/app/data
      # Claude CLI comes from the image — never bind-mount a host binary here
      # (see the note in docker-compose.yml). Credentials only.
      # Credentials come ONLY from the dedicated service-login directory
      # (STUDYAIO_CLAUDE_LOGIN_DIR, see scripts/setup-claude-login.sh), never
      # the operator's personal ~/.claude (R-025: transcripts, history and
      # plugins must not be visible to a worker that feeds untrusted text to
      # `claude -p`). Read-only on purpose: a writable mount would let a
      # compromised worker plant hooks into the host's Claude config.
      - ${STUDYAIO_CLAUDE_LOGIN_DIR:-/opt/studyaio/claude-login}/.credentials.json:/root/.claude/.credentials.json:ro
      - ${STUDYAIO_CLAUDE_LOGIN_DIR:-/opt/studyaio/claude-login}/settings.json:/root/.claude/settings.json:ro
      - ${STUDYAIO_CLAUDE_LOGIN_DIR:-/opt/studyaio/claude-login}:/run/claude-host:ro
    environment:
      <<: [*worker-environment, *claude-environment]
      WORKER_METRICS_PORT: "9101"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    # Loopback only: a host-local scraper reaches it, nothing else. Each pool has
    # its own host port; the container side is always 9101.
    ports: !override
      - "127.0.0.1:9101:9101"
    tmpfs:
      - /tmp/prometheus:mode=1777

  worker-ondemand:
    # On-demand AI pool.
    <<: *worker-deploy
    command: celery -A app.worker:celery_app worker --loglevel=info -Q ai_ondemand -n ondemand@%h --concurrency=2
    volumes: !override
      - ./data:/app/data
      # Claude CLI comes from the image — never bind-mount a host binary here
      # (see the note in docker-compose.yml). Credentials only.
      # Credentials come ONLY from the dedicated service-login directory
      # (STUDYAIO_CLAUDE_LOGIN_DIR, see scripts/setup-claude-login.sh), never
      # the operator's personal ~/.claude (R-025: transcripts, history and
      # plugins must not be visible to a worker that feeds untrusted text to
      # `claude -p`). Read-only on purpose: a writable mount would let a
      # compromised worker plant hooks into the host's Claude config.
      - ${STUDYAIO_CLAUDE_LOGIN_DIR:-/opt/studyaio/claude-login}/.credentials.json:/root/.claude/.credentials.json:ro
      - ${STUDYAIO_CLAUDE_LOGIN_DIR:-/opt/studyaio/claude-login}/settings.json:/root/.claude/settings.json:ro
      - ${STUDYAIO_CLAUDE_LOGIN_DIR:-/opt/studyaio/claude-login}:/run/claude-host:ro
    environment:
      <<: [*worker-environment, *claude-environment]
      WORKER_METRICS_PORT: "9101"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    # Loopback only: a host-local scraper reaches it, nothing else. Each pool has
    # its own host port; the container side is always 9101.
    ports: !override
      - "127.0.0.1:9102:9101"
    tmpfs:
      - /tmp/prometheus:mode=1777

  worker-maintenance:
    # Maintenance pool: beat jobs, backups, re-embedding. No Claude login (it
    # still gets .env, so instance AI keys and SETTINGS_ENCRYPTION_KEY). Runs as
    # the image user, set in docker-compose.yml.
    <<: *worker-deploy
    command: celery -A app.worker:celery_app worker --loglevel=info -Q maintenance -n maintenance@%h --concurrency=1
    volumes: !override
      - ./data:/app/data
      # See docker-compose.yml: run_backup needs the script and a persistent
      # destination, neither of which the image carries. GL#24. run_backup runs
      # on the maintenance queue, so only this pool mounts them.
      - ./scripts/backup.sh:/app/scripts/backup.sh:ro
      - ./backups:/app/backups
    environment:
      <<: *worker-environment
      WORKER_METRICS_PORT: "9101"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    # Loopback only: a host-local scraper reaches it, nothing else. Each pool has
    # its own host port; the container side is always 9101.
    ports: !override
      - "127.0.0.1:9103:9101"
    tmpfs:
      - /tmp/prometheus:mode=1777

  beat:
    image: ghcr.io/${GHCR_OWNER:-alcybersec}/studyaio-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    volumes: !override
      - ./data:/app/data

  db:
    restart: unless-stopped
    ports: !override []

  redis:
    restart: unless-stopped
    ports: !override []
